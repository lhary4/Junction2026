[project]
name = "trusted-trade-agents"
version = "0.1.0"
description = "Trusted Trade Agents for Valio Aimo (Junction 2026)"
requires-python = ">=3.14"
dependencies = [
    "ap2 @ git+https://github.com/google-agentic-commerce/AP2@e1ea56db72a6385bce3e5c1112b3a56ce60acb43",
    "pydantic==2.12.5",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "mcp==2.3.0",
    "google-genai==3.3.0",
    "requests",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["spikes", "*.md"]  # ruff must never rewrite code blocks in our docs
